<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Christmas at Pecksland House</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #263a2f; background: #f7f5ed; }
    body { margin: 0; }
    [hidden] { display: none !important; }
    .login-layout { min-height: 100dvh; display: grid; place-items: center; padding: 1.25rem; box-sizing: border-box; }
    .login-card { width: min(100%, 27rem); box-sizing: border-box; background: #fffdf6; border: 1px solid #d8d6c7; border-radius: 12px; padding: clamp(1.5rem, 6vw, 3rem); }
    h1 { font: 2.6rem/1.03 Georgia, serif; letter-spacing: -.04em; margin: 0 0 .9rem; }
    p { line-height: 1.55; }
    form { display: grid; gap: .7rem; margin-top: 1.5rem; }
    label { font-weight: 650; }
    input, button { box-sizing: border-box; font: inherit; padding: .65rem .85rem; border-radius: 5px; }
    input { width: 100%; background: #fffef8; border: 1px solid #808b7c; }
    button { cursor: pointer; background: #244735; color: #fffdf6; border: 1px solid transparent; font-weight: 650; }
    button:disabled { opacity: .65; cursor: default; }
    :focus-visible { outline: 3px solid #96503b; outline-offset: 3px; }
    #status:empty { margin: 0; }
    #login-actions { display: flex; gap: .6rem; flex-wrap: wrap; }
    #planner-shell { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100dvh; }
    #session-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .5rem 1rem; padding: .5rem 1rem; border-bottom: 1px solid #d8d6c7; }
    #session-email { overflow-wrap: anywhere; }
    #planner-frame { width: 100%; height: 100%; display: block; border: 0; }
    @media print { #session-bar { display: none; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"
    integrity="sha384-A97u3Qnt9GZHURO9YJZRe7VQgGUeFzcv6I1oIGnUTxQrCxnpQMwR0/G8F2zt9abZ"
    crossorigin="anonymous" defer></script>
  <script type="module" src="./auth.js"></script>
</head>
<body>
  <main class="login-layout" id="login">
    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">Christmas at Pecksland House</h1>
      <p>Sign in with your invited email address. We’ll send you a link to open the family planner.</p>
      <form id="login-form" hidden>
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" required>
        <button id="send-link" type="submit">Send sign-in link</button>
      </form>
      <p id="status" role="status">Checking sign-in…</p>
      <noscript><p>Enable JavaScript to sign in to the planner.</p></noscript>
      <div id="login-actions">
        <button id="retry-load" type="button" hidden>Try opening again</button>
        <button id="login-sign-out" type="button" hidden>Sign out</button>
      </div>
    </section>
  </main>
  <section id="planner-shell" aria-label="Family planner" hidden>
    <header id="session-bar">
      <span id="session-email"></span>
      <button id="sign-out" type="button">Sign out</button>
    </header>
    <iframe id="planner-frame" title="Christmas at Pecksland House planner"></iframe>
  </section>
</body>
</html>
